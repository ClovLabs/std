name: docs
run-name: '[Docs] ${{ github.ref_name }}'

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    docs:
        name: Generate & Deploy Docs
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun Project
              uses: ./.github/actions/setup-bun-project

            - name: Build
              run: bun run build

            - name: Generate Docs
              run: bun run docs

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs
