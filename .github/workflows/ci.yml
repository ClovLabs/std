name: ci
run-name: "[CI] ${{ github.event.pull_request && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || github.ref_name }}"

on:
    pull_request:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.check }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: true
            matrix:
                check: [fmt:check, lint:github, test]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Bun Project
              uses: ./.github/actions/setup-bun-project

            - name: Build
              run: bun run build

            - name: ${{ matrix.check }}
              run: bun run ${{ matrix.check }}
